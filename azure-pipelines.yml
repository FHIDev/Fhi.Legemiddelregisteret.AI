trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: Fhi.Lmr.AI - Secrets

steps:
- checkout: self
  fetchDepth: 0

- script: |
    mkdir -p ~/.ssh
    echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    chmod 600 ~/.ssh/id_ed25519
    ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

    git remote remove github 2>/dev/null || true
    git remote add github git@github.com:FHIDev/Fhi.Legemiddelregisteret.AI.git
    git push github HEAD:refs/heads/main --force
  displayName: Mirror to GitHub
  env:
    SSH_PRIVATE_KEY_B64: $(SSH_PRIVATE_KEY_B64)